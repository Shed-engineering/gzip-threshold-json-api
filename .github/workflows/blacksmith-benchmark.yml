name: blacksmith-benchmark

on:
  workflow_dispatch:

jobs:
  github-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run measurement suite
        run: |
          .github/scripts/run-trials.sh

  blacksmith:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Run measurement suite
        run: |
          .github/scripts/run-trials.sh
